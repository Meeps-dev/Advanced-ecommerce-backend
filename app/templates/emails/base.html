<!doctype html>
<html>
  <head>
    <style>
      .container {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: auto;
        border: 1px solid #eee;
        padding: 20px;
      }
      .header {
        background-color: #4caf50;
        color: white;
        padding: 10px;
        text-align: center;
      }
      .footer {
        font-size: 12px;
        color: #888;
        text-align: center;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Advanced Ecommerce</h1>
      </div>
      {% block content %}{% endblock %}
      <div class="footer">
        <p>&copy; 2024 Advanced Ecommerce Inc. | Lagos, Nigeria</p>
      </div>
    </div>
  </body>
</html>
