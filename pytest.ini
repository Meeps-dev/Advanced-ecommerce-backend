[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers
asyncio_mode = auto
filterwarnings =
    ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning:passlib.handlers.argon2
    ignore:datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning:sqlalchemy.sql.schema
markers =
    unit: fast isolated tests with mocks
    integration: api plus database plus redis tests
    e2e: end to end user journey tests