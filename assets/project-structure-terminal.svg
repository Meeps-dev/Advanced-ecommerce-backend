<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="980" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0F1A"/>
      <stop offset="1" stop-color="#121B2E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1600" height="980" rx="30" fill="url(#bg)"/>

  <rect x="80" y="70" width="1440" height="840" rx="20" fill="#0B1220" stroke="#26344F" filter="url(#shadow)"/>
  <rect x="80" y="70" width="1440" height="56" rx="20" fill="#101A2D"/>
  <circle cx="116" cy="98" r="8" fill="#FF5F56"/>
  <circle cx="142" cy="98" r="8" fill="#FFBD2E"/>
  <circle cx="168" cy="98" r="8" fill="#27C93F"/>
  <text x="720" y="104" fill="#9FB3D4" font-family="Menlo, Monaco, Consolas, monospace" font-size="18" text-anchor="middle">project-structure-terminal.svg</text>

  <text x="120" y="170" fill="#7EE787" font-family="Menlo, Monaco, Consolas, monospace" font-size="26">$ tree -L 3 advanced-ecommerce</text>

  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="23" fill="#DDE7FF">
    <text x="120" y="220">advanced-ecommerce</text>
    <text x="120" y="260">├── app</text>
    <text x="120" y="300">│   ├── api</text>
    <text x="120" y="340">│   ├── core</text>
    <text x="120" y="380">│   ├── dependencies</text>
    <text x="120" y="420">│   ├── modules</text>
    <text x="120" y="460">│   │   ├── auth</text>
    <text x="120" y="500">│   │   ├── catalog</text>
    <text x="120" y="540">│   │   ├── cart</text>
    <text x="120" y="580">│   │   ├── orders</text>
    <text x="120" y="620">│   │   ├── payments</text>
    <text x="120" y="660">│   │   ├── reviews</text>
    <text x="120" y="700">│   │   ├── inventory</text>
    <text x="120" y="740">│   │   ├── addresses</text>
    <text x="120" y="780">│   │   ├── admin</text>
    <text x="120" y="820">│   │   └── analytics</text>
  </g>

  <g font-family="Menlo, Monaco, Consolas, monospace" font-size="23" fill="#DDE7FF">
    <text x="760" y="260">├── migrations</text>
    <text x="760" y="300">├── tests</text>
    <text x="760" y="340">├── traefik</text>
    <text x="760" y="380">├── docker-compose.yml</text>
    <text x="760" y="420">├── docker-compose.dev.yml</text>
    <text x="760" y="460">├── Dockerfile</text>
    <text x="760" y="500">├── Makefile</text>
    <text x="760" y="540">└── README.md</text>
  </g>

  <rect x="760" y="600" width="700" height="250" rx="16" fill="#0F1A2D" stroke="#2B3D5F"/>
  <text x="790" y="650" fill="#9CDCFE" font-family="Menlo, Monaco, Consolas, monospace" font-size="24"># recruiter notes</text>
  <text x="790" y="695" fill="#C8D6F2" font-family="Menlo, Monaco, Consolas, monospace" font-size="21">- modular domains make ownership obvious</text>
  <text x="790" y="735" fill="#C8D6F2" font-family="Menlo, Monaco, Consolas, monospace" font-size="21">- service/repository split supports testing and scale</text>
  <text x="790" y="775" fill="#C8D6F2" font-family="Menlo, Monaco, Consolas, monospace" font-size="21">- infra and runtime artifacts are first-class</text>
  <text x="790" y="815" fill="#C8D6F2" font-family="Menlo, Monaco, Consolas, monospace" font-size="21">- easy to discuss architecture in interviews</text>

  <text x="120" y="880" fill="#6F83A8" font-family="Menlo, Monaco, Consolas, monospace" font-size="18">Terminal-style structure screenshot for portfolio README.</text>
</svg>
