<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" fill="none">
  <defs>
    <linearGradient id="bg" x1="100" y1="40" x2="1500" y2="940" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220"/>
      <stop offset="1" stop-color="#13213D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="980" rx="32" fill="url(#bg)"/>
  <rect x="70" y="70" width="1460" height="840" rx="28" fill="#0F172A" stroke="#23314C" filter="url(#shadow)"/>

  <text x="120" y="140" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">Project Structure Diagram</text>
  <text x="120" y="182" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">How the codebase is organized for modularity, testability, and maintainability.</text>

  <rect x="120" y="230" width="1360" height="620" rx="20" fill="#0B1326" stroke="#23314C"/>

  <g font-family="JetBrains Mono, Menlo, Consolas, monospace" font-size="24" fill="#CDE2FF">
    <text x="160" y="285">advanced-ecommerce/</text>
    <text x="200" y="335">app/</text>
    <text x="240" y="375">api/          # API composition + health</text>
    <text x="240" y="415">core/         # config, security, logging, exceptions</text>
    <text x="240" y="455">dependencies/ # dependency injection for services</text>
    <text x="240" y="495">modules/      # domain-driven feature modules</text>
    <text x="280" y="535">auth, catalog, cart, orders, payments</text>
    <text x="280" y="575">addresses, reviews, inventory, admin, analytics, users</text>
    <text x="240" y="615">tasks/        # async jobs (emails, order workflows)</text>
    <text x="200" y="665">migrations/   # Alembic schema history</text>
    <text x="200" y="705">tests/        # unit, integration, e2e coverage</text>
    <text x="200" y="745">traefik/      # gateway routing configuration</text>
    <text x="200" y="785">docker-compose*.yml, Dockerfile, Makefile</text>
  </g>

  <rect x="980" y="260" width="470" height="210" rx="18" fill="#111C33" stroke="#3DDC97"/>
  <text x="1010" y="305" fill="#A7F3D0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Architecture Signals Recruiters Look For</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#D1E8D8">
    <text x="1010" y="345">• Domain modules over giant route files</text>
    <text x="1010" y="375">• Service boundaries that support testing</text>
    <text x="1010" y="405">• Infra concerns isolated in core/dependencies</text>
    <text x="1010" y="435">• Deployment artifacts committed with code</text>
  </g>

  <rect x="980" y="500" width="470" height="210" rx="18" fill="#111C33" stroke="#5BC0EB"/>
  <text x="1010" y="545" fill="#BFE6F6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">At A Glance</text>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" fill="#D6EAF4">
    <text x="1010" y="585">• 12 API router groups</text>
    <text x="1010" y="615">• 8 Dockerized runtime services</text>
    <text x="1010" y="645">• 51 passed tests in latest report</text>
    <text x="1010" y="675">• Full commerce flow represented</text>
  </g>

  <text x="120" y="890" fill="#6B7E9B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Diagram asset generated for README portfolio presentation.</text>
</svg>
