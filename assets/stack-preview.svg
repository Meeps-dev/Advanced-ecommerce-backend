<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="bg2" x1="180" y1="0" x2="1440" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111F"/>
      <stop offset="1" stop-color="#10203D"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg2)"/>
  <rect x="80" y="80" width="1440" height="740" rx="28" fill="#0F172A" stroke="#23314C" filter="url(#shadow2)"/>

  <text x="130" y="150" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800">Commerce stack preview</text>
  <text x="130" y="195" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">From gateway to database: the project is designed as a real production-style system.</text>

  <rect x="130" y="260" width="260" height="110" rx="22" fill="#111C33" stroke="#3B82F6"/>
  <text x="260" y="305" fill="#93C5FD" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Traefik</text>
  <text x="260" y="340" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Gateway / routing</text>

  <rect x="450" y="260" width="260" height="110" rx="22" fill="#111C33" stroke="#3DDC97"/>
  <text x="580" y="305" fill="#A7F3D0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">FastAPI</text>
  <text x="580" y="340" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">12 router groups</text>

  <rect x="770" y="260" width="260" height="110" rx="22" fill="#111C33" stroke="#F59E0B"/>
  <text x="900" y="305" fill="#FCD34D" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Redis</text>
  <text x="900" y="340" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">Cache + broker</text>

  <rect x="1090" y="260" width="260" height="110" rx="22" fill="#111C33" stroke="#F472B6"/>
  <text x="1220" y="305" fill="#FBCFE8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">PostgreSQL</text>
  <text x="1220" y="340" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">System of record</text>

  <line x1="390" y1="315" x2="450" y2="315" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <line x1="710" y1="315" x2="770" y2="315" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>
  <line x1="1030" y1="315" x2="1090" y2="315" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>

  <rect x="130" y="440" width="1330" height="250" rx="24" fill="#0B1326" stroke="#23314C"/>
  <text x="160" y="490" fill="#E2E8F0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Recruiter-friendly proof points</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20" fill="#CBD5E1">
    <text x="170" y="545">• Authentication, catalog, cart, orders, payments, reviews, inventory, addresses, admin, analytics</text>
    <text x="170" y="585">• Celery worker, beat scheduler, and DLQ queue for async processing and reliability</text>
    <text x="170" y="625">• Cache-aware services, payment webhooks, and explicit health checks for production posture</text>
    <text x="170" y="665">• Alembic migrations, Docker Compose, and Traefik gateway for repeatable local or containerized runs</text>
  </g>

  <rect x="1140" y="470" width="250" height="190" rx="20" fill="#111C33" stroke="#3DDC97"/>
  <text x="1265" y="515" fill="#A7F3D0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Metrics</text>
  <text x="1265" y="560" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800" text-anchor="middle">51 / 3</text>
  <text x="1265" y="595" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">tests passed / skipped</text>
  <text x="1265" y="625" fill="#94A3B8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" text-anchor="middle">4 users, 5 categories, 10 products</text>

  <text x="130" y="760" fill="#64748B" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Designed to tell a stronger story than a standard CRUD repo: clear boundaries, async workflows, and operational maturity.</text>
</svg>
