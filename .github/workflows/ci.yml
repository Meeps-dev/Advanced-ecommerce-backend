name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging, main]

env:
  PYTHONPATH: .
  SECRET_KEY: test-secret
  MAIL_FROM: test@example.com
  MAIL_FROM_NAME: Test
  RESEND_API_KEY: test
  PAYSTACK_SECRET_KEY: test
  SENTRY_DSN: ""
  SENTRY_ENVIRONMENT: ci
  REDIS_URL: redis://localhost:6379/0
  CELERY_BROKER_URL: redis://localhost:6379/0
  CELERY_RESULT_BACKEND: redis://localhost:6379/0

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: |
          pytest -m unit -q -ra

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_db
      RUN_MIGRATIONS: "false"
      SEED_DATA: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Run integration tests
        run: |
          pytest -m integration -q -ra

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: integration
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ecommerce_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BASE_URL: http://127.0.0.1:8000
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_db
      RUN_MIGRATIONS: "false"
      SEED_DATA: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps

      - name: Run migrations
        run: |
          alembic upgrade head

      - name: Start API (uvicorn)
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &

      - name: Wait for API
        run: |
          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8000/docs >/dev/null; then
              echo "API is up"
              exit 0
            fi
            echo "Waiting for API... ($i/40)"
            sleep 2
          done
          echo "API failed to start"
          echo "---- uvicorn log ----"
          tail -n 200 uvicorn.log || true
          exit 1   

      - name: Run e2e tests
        run: |
          pytest -m e2e -q -ra
