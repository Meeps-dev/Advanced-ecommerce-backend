name: Deploy (production)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production (Render)
    # Only run when CI succeeded AND the CI run was on the main branch
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      }}
    runs-on: ubuntu-latest

    # This is what triggers the GitHub Environment approval gate (if configured)
    environment: production

    steps:
      - name: Trigger Render deploy (production)
        run: |
          set -euo pipefail
          echo "Triggering Render deploy via deploy hook..."
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for service to be healthy (/health/db)
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          set -euo pipefail

          echo "Waiting for API to become healthy at: ${BASE_URL}/health/db"
          for i in {1..60}; do
            echo "Attempt $i/60..."

            resp="$(curl -sS "${BASE_URL}/health/db" || true)"

            if echo "$resp" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "Service is healthy."
              echo "$resp"
              exit 0
            fi

            echo "Not healthy yet. Response was:"
            echo "$resp"
            sleep 5
          done

          echo "Service did not become healthy in time."
          exit 1
