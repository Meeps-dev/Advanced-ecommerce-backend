name: Deploy (dev)

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you deploying? (optional)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to dev (Render)
    # Auto-deploy only when CI succeeded on a real push to develop (not PR, not re-run noise).
    # Manual deploy always allowed via workflow_dispatch.
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'develop' &&
          github.event.workflow_run.event == 'push' &&
          (github.event.workflow_run.pull_requests == null || github.event.workflow_run.pull_requests[0] == null)
        )
      }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Trigger Render deploy (dev)
        run: |
          set -euo pipefail
          echo "Triggering Render deploy via deploy hook..."
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Wait for service to be healthy (/api/v1/health/db)
        env:
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          set -euo pipefail

          echo "Waiting for API to become healthy at: ${BASE_URL}/api/v1/health/db"
          for i in {1..60}; do
            echo "Attempt $i/60..."

            resp="$(curl -sS "${BASE_URL}/api/v1/health/db" || true)"

            if echo "$resp" | grep -q '"status"[[:space:]]*:[[:space:]]*"healthy"'; then
              echo "Service is healthy."
              echo "$resp"
              exit 0
            fi

            echo "Not healthy yet. Response was:"
            echo "$resp"
            sleep 5
          done

          echo "Service did not become healthy in time."
          exit 1
